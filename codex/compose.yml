services:
  codex:
    build:
      context: ${CODEX_RUNNER_DIR}
      dockerfile: Dockerfile
    image: ${CODEX_IMAGE_NAME:-local/codex-rust:latest}
    stdin_open: true
    tty: true
    init: true
    read_only: true
    pids_limit: 512
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 1.0
    dns_search: []
    security_opt:
      - seccomp=./seccomp-bwrap.json
    cap_drop:
      - ALL
    logging:
      driver: "none"
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=512m,mode=1777
      - /home/codex/.cache:rw,nosuid,nodev,size=256m,uid=1000,gid=1000,mode=700
      - /home/codex/.config:rw,nosuid,nodev,size=64m,uid=1000,gid=1000,mode=700
      - /home/codex/.local:rw,nosuid,nodev,size=128m,uid=1000,gid=1000,mode=700
      - /home/codex/.npm:rw,nosuid,nodev,size=256m,uid=1000,gid=1000,mode=700
    environment:
      HOME: /home/codex
      TMPDIR: /tmp
      XDG_RUNTIME_DIR: /tmp/codex-runtime
      npm_config_cache: /tmp/npm-cache
      TERM: xterm-256color
      COLORTERM: truecolor
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GIT_SSH_COMMAND: ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile=/home/codex/.ssh/known_hosts -o UpdateHostKeys=no
      OTEL_TRACES_EXPORTER: none
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
    volumes:
      - ${CODEX_WORKSPACE_DIR}:/workspace
      - ${CODEX_STATE_DIR}:/home/codex/.codex
      - ${CODEX_SSH_DIR}:/home/codex/.ssh:ro
      - ${CODEX_SECRETS_DIR}:/run/agent-secrets:ro
    working_dir: /workspace
